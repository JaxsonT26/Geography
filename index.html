<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoQuest Kids</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900">
<header class="sticky top-0 z-40 bg-white border-b"><div class="max-w-6xl mx-auto p-4 flex justify-between"><b class="text-xl text-blue-700">🌍 GeoQuest Kids</b><nav class="space-x-2"><button data-go="learn" class="px-3 py-2">Learn</button><button data-go="quizzes" class="px-3 py-2">Quizzes</button><button data-go="teachers" class="px-3 py-2">Teachers</button></nav></div></header>
<section class="bg-gradient-to-br from-teal-700 via-blue-600 to-violet-700 text-white"><div class="max-w-6xl mx-auto p-8 md:p-16"><p class="uppercase tracking-widest font-bold text-cyan-100">Explore • Discover • Learn</p><h1 class="text-4xl md:text-6xl font-black mt-2">The world is your classroom.</h1><p class="max-w-2xl mt-4 text-lg">Interactive geography for young learners, with a complete country directory, working quizzes, flag challenges and teacher resources.</p><div class="flex flex-wrap gap-3 mt-7"><button data-quiz="world" class="bg-white text-blue-700 font-bold px-5 py-3 rounded-2xl">🧠 Start quiz</button><button data-action="countries" class="bg-white/20 px-5 py-3 rounded-2xl">🌎 Countries</button></div></div></section>
<main class="max-w-6xl mx-auto p-4 md:p-8"><section id="learn"><h2 class="text-3xl font-black">Learning Hub</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-5"><button data-action="continents" class="text-left bg-white border rounded-3xl p-6"><span class="text-4xl">🌎</span><h3 class="font-black text-xl mt-3">Continents</h3><p class="text-slate-500">Explore all seven.</p></button><button data-action="countries" class="text-left bg-white border rounded-3xl p-6"><span class="text-4xl">🌐</span><h3 class="font-black text-xl mt-3">Countries of the World</h3><p class="text-slate-500">All 195 countries.</p></button><button data-action="flags" class="text-left bg-white border rounded-3xl p-6"><span class="text-4xl">🚩</span><h3 class="font-black text-xl mt-3">Flag Challenge</h3><p class="text-slate-500">Guess flags and score points.</p></button><button data-action="fact" class="text-left bg-white border rounded-3xl p-6"><span class="text-4xl">💡</span><h3 class="font-black text-xl mt-3">World Wonder</h3><p class="text-slate-500">Discover a geography fact.</p></button></div><div class="mt-5 bg-blue-50 rounded-2xl p-4"><b id="status">195-country directory ready.</b></div></section>
<section id="quizzes" class="mt-14"><div class="bg-slate-900 text-white rounded-3xl p-7"><p class="text-cyan-300 font-bold">QUIZ ZONE</p><h2 class="text-3xl font-black">Learn by playing</h2><div class="grid sm:grid-cols-3 gap-3 mt-5"><button data-quiz="world" class="bg-cyan-400 text-slate-950 p-4 rounded-2xl font-bold">🌍 World</button><button data-quiz="continents" class="bg-white/10 p-4 rounded-2xl font-bold">🗺️ Continents</button><button data-quiz="capitals" class="bg-white/10 p-4 rounded-2xl font-bold">🏙️ Capitals</button></div></div></section>
<section id="teachers" class="mt-14"><h2 class="text-3xl font-black">Teacher Corner</h2><div class="grid md:grid-cols-3 gap-4 mt-5"><button data-teacher="starter" class="text-left bg-violet-50 border rounded-3xl p-6"><b class="text-2xl">🎯</b><h3 class="font-black text-xl mt-3">Starter question</h3><p>Discussion prompt with follow-ups.</p></button><button data-teacher="check" class="text-left bg-emerald-50 border rounded-3xl p-6"><b class="text-2xl">📝</b><h3 class="font-black text-xl mt-3">5-question check</h3><p>Quick classroom assessment.</p></button><button data-teacher="activity" class="text-left bg-amber-50 border rounded-3xl p-6"><b class="text-2xl">🧭</b><h3 class="font-black text-xl mt-3">Explorer activity</h3><p>Country research task.</p></button></div></section></main>
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/70 p-4 items-center justify-center"><div class="bg-white rounded-3xl max-w-3xl w-full max-h-[92vh] overflow-auto p-6"><div class="flex justify-between"><h2 id="title" class="text-2xl font-black"></h2><button id="x" class="text-3xl">×</button></div><div id="body" class="mt-5"></div></div></div>
<script>
const raw=`Afghanistan|AF|Asia;Albania|AL|Europe;Algeria|DZ|Africa;Andorra|AD|Europe;Angola|AO|Africa;Antigua and Barbuda|AG|North America;Argentina|AR|South America;Armenia|AM|Asia;Australia|AU|Oceania;Austria|AT|Europe;Azerbaijan|AZ|Asia;Bahamas|BS|North America;Bahrain|BH|Asia;Bangladesh|BD|Asia;Barbados|BB|North America;Belarus|BY|Europe;Belgium|BE|Europe;Belize|BZ|North America;Benin|BJ|Africa;Bhutan|BT|Asia;Bolivia|BO|South America;Bosnia and Herzegovina|BA|Europe;Botswana|BW|Africa;Brazil|BR|South America;Brunei|BN|Asia;Bulgaria|BG|Europe;Burkina Faso|BF|Africa;Burundi|BI|Africa;Cabo Verde|CV|Africa;Cambodia|KH|Asia;Cameroon|CM|Africa;Canada|CA|North America;Central African Republic|CF|Africa;Chad|TD|Africa;Chile|CL|South America;China|CN|Asia;Colombia|CO|South America;Comoros|KM|Africa;Congo, Democratic Republic of the|CD|Africa;Congo, Republic of the|CG|Africa;Costa Rica|CR|North America;Cote d'Ivoire|CI|Africa;Croatia|HR|Europe;Cuba|CU|North America;Cyprus|CY|Europe;Czechia|CZ|Europe;Denmark|DK|Europe;Djibouti|DJ|Africa;Dominica|DM|North America;Dominican Republic|DO|North America;Ecuador|EC|South America;Egypt|EG|Africa;El Salvador|SV|North America;Equatorial Guinea|GQ|Africa;Eritrea|ER|Africa;Estonia|EE|Europe;Eswatini|SZ|Africa;Ethiopia|ET|Africa;Fiji|FJ|Oceania;Finland|FI|Europe;France|FR|Europe;Gabon|GA|Africa;Gambia|GM|Africa;Georgia|GE|Asia;Germany|DE|Europe;Ghana|GH|Africa;Greece|GR|Europe;Grenada|GD|North America;Guatemala|GT|North America;Guinea|GN|Africa;Guinea-Bissau|GW|Africa;Guyana|GY|South America;Haiti|HT|North America;Honduras|HN|North America;Hungary|HU|Europe;Iceland|IS|Europe;India|IN|Asia;Indonesia|ID|Asia;Iran|IR|Asia;Iraq|IQ|Asia;Ireland|IE|Europe;Israel|IL|Asia;Italy|IT|Europe;Jamaica|JM|North America;Japan|JP|Asia;Jordan|JO|Asia;Kazakhstan|KZ|Asia;Kenya|KE|Africa;Kiribati|KI|Oceania;Kuwait|KW|Asia;Kyrgyzstan|KG|Asia;Laos|LA|Asia;Latvia|LV|Europe;Lebanon|LB|Asia;Lesotho|LS|Africa;Liberia|LR|Africa;Libya|LY|Africa;Liechtenstein|LI|Europe;Lithuania|LT|Europe;Luxembourg|LU|Europe;Madagascar|MG|Africa;Malawi|MW|Africa;Malaysia|MY|Asia;Maldives|MV|Asia;Mali|ML|Africa;Malta|MT|Europe;Marshall Islands|MH|Oceania;Mauritania|MR|Africa;Mauritius|MU|Africa;Mexico|MX|North America;Micronesia|FM|Oceania;Moldova|MD|Europe;Monaco|MC|Europe;Mongolia|MN|Asia;Montenegro|ME|Europe;Morocco|MA|Africa;Mozambique|MZ|Africa;Myanmar|MM|Asia;Namibia|NA|Africa;Nauru|NR|Oceania;Nepal|NP|Asia;Netherlands|NL|Europe;New Zealand|NZ|Oceania;Nicaragua|NI|North America;Niger|NE|Africa;Nigeria|NG|Africa;North Korea|KP|Asia;North Macedonia|MK|Europe;Norway|NO|Europe;Oman|OM|Asia;Pakistan|PK|Asia;Palau|PW|Oceania;Palestine|PS|Asia;Panama|PA|North America;Papua New Guinea|PG|Oceania;Paraguay|PY|South America;Peru|PE|South America;Philippines|PH|Asia;Poland|PL|Europe;Portugal|PT|Europe;Qatar|QA|Asia;Romania|RO|Europe;Russia|RU|Europe;Rwanda|RW|Africa;Saint Kitts and Nevis|KN|North America;Saint Lucia|LC|North America;Saint Vincent and the Grenadines|VC|North America;Samoa|WS|Oceania;San Marino|SM|Europe;Sao Tome and Principe|ST|Africa;Saudi Arabia|SA|Asia;Senegal|SN|Africa;Serbia|RS|Europe;Seychelles|SC|Africa;Sierra Leone|SL|Africa;Singapore|SG|Asia;Slovakia|SK|Europe;Slovenia|SI|Europe;Solomon Islands|SB|Oceania;Somalia|SO|Africa;South Africa|ZA|Africa;South Korea|KR|Asia;South Sudan|SS|Africa;Spain|ES|Europe;Sri Lanka|LK|Asia;Sudan|SD|Africa;Suriname|SR|South America;Sweden|SE|Europe;Switzerland|CH|Europe;Syria|SY|Asia;Tajikistan|TJ|Asia;Tanzania|TZ|Africa;Thailand|TH|Asia;Timor-Leste|TL|Asia;Togo|TG|Africa;Tonga|TO|Oceania;Trinidad and Tobago|TT|North America;Tunisia|TN|Africa;Turkiye|TR|Asia;Turkmenistan|TM|Asia;Tuvalu|TV|Oceania;Uganda|UG|Africa;Ukraine|UA|Europe;United Arab Emirates|AE|Asia;United Kingdom|GB|Europe;United States|US|North America;Uruguay|UY|South America;Uzbekistan|UZ|Asia;Vanuatu|VU|Oceania;Vatican City|VA|Europe;Venezuela|VE|South America;Vietnam|VN|Asia;Yemen|YE|Asia;Zambia|ZM|Africa;Zimbabwe|ZW|Africa`;
const countries=raw.split(';').map(s=>{let[n,c,r]=s.split('|');return{name:n,code:c,region:r,flag:String(c).replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt(0)))}}),continents=[['Africa','🌍','54 countries'],['Antarctica','🧊','No sovereign countries'],['Asia','🌏','49 countries'],['Europe','🏰','44 countries'],['North America','🌎','23 countries'],['South America','🌎','12 countries'],['Oceania','🌊','14 countries']],questions={world:[['Which continent is largest by land area?',['Asia','Africa','Europe','Oceania'],'Asia'],['Which ocean is largest?',['Pacific','Atlantic','Indian','Arctic'],'Pacific'],['Which country has Tokyo as its capital?',['Japan','China','Thailand','South Korea'],'Japan'],['Which desert is in northern Africa?',['Sahara','Gobi','Atacama','Mojave'],'Sahara'],['Which mountain is highest above sea level?',['Mount Everest','K2','Denali','Kilimanjaro'],'Mount Everest']],continents:[['Which continent contains most of the Amazon Basin?',['South America','Africa','Asia','Europe'],'South America'],['Which continent has no sovereign countries?',['Antarctica','Europe','Africa','Oceania'],'Antarctica'],['Australia is part of which region?',['Oceania','Europe','Asia','Africa'],'Oceania'],['Where is the Sahara?',['Africa','Asia','North America','South America'],'Africa'],['Where are the Alps?',['Europe','Africa','Asia','South America'],'Europe']],capitals:[['Capital of France?',['Paris','Rome','Madrid','Lisbon'],'Paris'],['Capital of Japan?',['Tokyo','Kyoto','Osaka','Seoul'],'Tokyo'],['Capital of Kenya?',['Nairobi','Kampala','Accra','Dakar'],'Nairobi'],['Capital of Brazil?',['Brasilia','Rio de Janeiro','Sao Paulo','Salvador'],'Brasilia'],['Capital of Canada?',['Ottawa','Toronto','Vancouver','Montreal'],'Ottawa']]};
const $=x=>document.getElementById(x),open=(t,h)=>{$('title').textContent=t;$('body').innerHTML=h;$('modal').classList.remove('hidden');$('modal').classList.add('flex')},close=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex')};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function countryView(){open('🌐 Countries of the World',`<input id="search" placeholder="Search a country…" class="w-full border rounded-xl p-3 mb-3"><p id="count" class="text-sm text-slate-500 mb-3">195 countries</p><div id="list" class="grid sm:grid-cols-2 gap-3">${cards(countries)}</div>`)}
function cards(a){return a.map(c=>`<button data-country="${esc(c.name)}" class="text-left border rounded-2xl p-4 hover:bg-blue-50"><span class="text-4xl">${c.flag}</span><b class="block mt-2">${esc(c.name)}</b><span class="text-sm text-slate-500">${esc(c.region)}</span></button>`).join('')}
function quiz(type){let qs=questions[type],i=0,score=0;function render(){let q=qs[i];open('🧠 Geography Quiz',`<p class="text-sm text-slate-500">Question ${i+1} of ${qs.length} • Score ${score}</p><h3 class="text-2xl font-black mt-3">${esc(q[0])}</h3><div class="space-y-3 mt-5">${q[1].map((o,j)=>`<button data-q="${j}" class="w-full text-left border-2 rounded-2xl p-4 font-bold">${esc(o)}</button>`).join('')}</div><p id="feedback" class="mt-4"></p>`)}function answer(j){let q=qs[i],ok=q[1][j]===q[2];score+=ok;document.querySelectorAll('[data-q]').forEach(b=>b.disabled=true);$('feedback').innerHTML=ok?'<b class="text-green-600">✅ Correct!</b>':`<b class="text-red-600">❌ Correct answer: ${esc(q[2])}</b>`;setTimeout(()=>{i++;i<qs.length?render():open('🏆 Quiz complete!',`<div class="text-center"><p class="text-5xl">🎉</p><p class="text-4xl font-black mt-3">${score}/5</p><button data-quiz="${type}" class="mt-5 w-full bg-blue-600 text-white p-3 rounded-2xl font-bold">Play again</button></div>`)},650)}render();return j=>answer(j)}
let activeQuiz=null;function startQuiz(t){activeQuiz=quiz(t)}
function flags(){let c=countries[Math.floor(Math.random()*countries.length)];open('🚩 Flag Challenge',`<div class="text-center"><p class="text-8xl">${c.flag}</p><h3 class="text-xl font-black mt-4">Which country uses this flag?</h3><input id="guess" class="w-full border rounded-xl p-3 mt-4 text-center" placeholder="Country name"><button id="check" class="mt-3 w-full bg-violet-600 text-white p-3 rounded-2xl font-bold">Check answer</button><p id="fb" class="mt-4"></p></div>`);$('check').onclick=()=>{$('fb').innerHTML=$('guess').value.trim().toLowerCase()===c.name.toLowerCase()?'✅ Correct!':'❌ Try again — the answer is '+esc(c.name)}}
function teachers(t){if(t==='check'){quiz('world');return}if(t==='starter')open('🎯 Teacher Starter',`<div class="bg-violet-50 rounded-2xl p-5"><b>DISCUSSION QUESTION</b><h3 class="text-2xl font-black mt-2">Why are many major cities built near rivers or coasts?</h3><p class="mt-4 text-slate-600">Follow-up: What advantages and risks can water bring?</p></div>`);else open('🧭 Explorer Activity',`<h3 class="text-2xl font-black">Become a country explorer</h3><ol class="list-decimal pl-6 mt-4 space-y-2"><li>Locate a country on a map.</li><li>Find its capital.</li><li>Identify its continent and a neighbor.</li><li>Find a physical geography feature.</li><li>Share one interesting fact.</li></ol><button data-action="countries" class="mt-5 w-full bg-amber-500 text-white p-3 rounded-2xl font-bold">Open country library</button>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b=== $('x'))return close();if(b.dataset.go){$(b.dataset.go).scrollIntoView();return}if(b.dataset.action==='countries')return countryView();if(b.dataset.action==='continents')return open('🌎 Continents','<div class="grid sm:grid-cols-2 gap-3">'+continents.map(c=>`<div class="border rounded-2xl p-4"><span class="text-3xl">${c[1]}</span><b class="block mt-2">${c[0]}</b><p class="text-sm text-slate-500">${c[2]}</p></div>`).join('')+'</div>');if(b.dataset.action==='flags')return flags();if(b.dataset.action==='fact')return open('💡 World Wonder','<p class="text-2xl font-black">🌳 The Amazon is the largest tropical rainforest.</p>');if(b.dataset.quiz)return startQuiz(b.dataset.quiz);if(b.dataset.q!=null)return activeQuiz(+b.dataset.q);if(b.dataset.country)return open('🌍 '+b.dataset.country,'<p>Use a map to locate this country and research its capital, neighboring countries and physical geography.</p>');if(b.dataset.teacher)return teachers(b.dataset.teacher)});document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase(),a=countries.filter(c=>c.name.toLowerCase().includes(q));$('list').innerHTML=cards(a);$('count').textContent=a.length+' countries'}});$('x').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};
</script></body></html>
